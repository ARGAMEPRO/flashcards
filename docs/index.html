<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карточки — запоминание с повторением</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#07070a">
<meta name="description" content="Карточки для запоминания: вопрос на одной стороне, ответ на другой, повторы по интервалам.">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Cormorant+Garamond:ital,wght@1,500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="top">
    <div class="brand">карточки<span class="dot">*</span></div>
    <div class="stats" id="stats"></div>
  </header>

  <section class="panel">
    <div class="eyebrow" id="review-label">повторение</div>

    <div class="stage">
      <div class="card" id="flip">
        <div class="face front">
          <span class="side">вопрос</span>
          <p class="text" id="card-front">Нажмите «Начать», чтобы пройти то, что пора повторить.</p>
          <span class="flip-hint" id="flip-hint">нажмите на карточку</span>
        </div>
        <div class="face back">
          <span class="side">ответ</span>
          <p class="text" id="card-back"></p>
          <span class="flip-hint">вернуть вопрос</span>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn" id="btn-start">Начать</button>
      <button class="btn hidden" id="btn-know">Знаю</button>
      <button class="btn no hidden" id="btn-dunno">Забыл</button>
    </div>
    <p class="hint">Пробел или клик по карточке — перевернуть, 1 — знаю, 2 — забыл</p>
  </section>

  <section class="panel">
    <div class="eyebrow">новая карточка</div>
    <form id="add-form">
      <label>Вопрос или термин
        <input id="front" autocomplete="off" required maxlength="200" placeholder="Что такое DNS?">
      </label>
      <label>Ответ
        <input id="back" autocomplete="off" required maxlength="300" placeholder="Справочник доменных имён">
      </label>
      <button class="btn ok" type="submit">Добавить</button>
    </form>
  </section>

  <section class="panel">
    <div class="eyebrow">все карточки</div>
    <ul class="list" id="list"></ul>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
