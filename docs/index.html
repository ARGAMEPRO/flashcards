<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карточки — запоминание с повторением</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="top">
    <div class="brand">карточки</div>
    <div class="stats" id="stats"></div>
  </header>

  <section class="panel" id="review-panel">
    <div class="eyebrow" id="review-label">повторение</div>
    <div class="card" id="card-front">Нажмите «Начать», чтобы пройти то, что пора повторить.</div>
    <div class="card back hidden" id="card-back"></div>
    <div class="actions">
      <button class="btn" id="btn-start">Начать</button>
      <button class="btn hidden" id="btn-show">Показать ответ</button>
      <button class="btn ok hidden" id="btn-know">Знаю</button>
      <button class="btn no hidden" id="btn-dunno">Забыл</button>
    </div>
    <p class="hint">Пробел — показать ответ, 1 — знаю, 2 — забыл</p>
  </section>

  <section class="panel">
    <div class="eyebrow">новая карточка</div>
    <form id="add-form">
      <label>Вопрос или термин
        <input id="front" autocomplete="off" required maxlength="200" placeholder="Что такое DNS?">
      </label>
      <label>Ответ
        <input id="back" autocomplete="off" required maxlength="300" placeholder="Справочник доменных имён">
      </label>
      <button class="btn ok" type="submit">Добавить</button>
    </form>
  </section>

  <section class="panel">
    <div class="eyebrow">все карточки</div>
    <ul class="list" id="list"></ul>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
